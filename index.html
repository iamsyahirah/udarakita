<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101210" />
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem('udarakita:appearance:v1')) || {}
        const theme = settings.theme === 'light' || (settings.theme === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches) ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.documentElement.lang = settings.language === 'ms' ? 'ms' : 'en'
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101210' : '#f3f5f0'
      } catch {}
    </script>
    <meta name="description" content="Check the latest available Malaysian API/IPU readings from Haze Monitor monitoring stations." />
    <title>UdaraKita — Malaysia Air Quality Checker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="UdaraKita" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
